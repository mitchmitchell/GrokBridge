# tak-bridge configuration. Copy to /etc/takbridge/takbridge.ini and make it
# readable only by the service user:  chmod 600, owned by takbridge.

[bridge]
# TAK Server streaming address: tcp://HOST:8087 or tls://HOST:8089
cot_url = tls://tak.example.ts.net:8089

# Where the bots appear on the map (a TAK contact needs a position).
lat = 35.0000
lon = -90.0000

# TAK group (team colour) and role the bots announce.
group = Cyan
role = Team Member

# Presence: announce every 30 s; ATAK drops the contact after 120 s of silence.
presence_interval_s = 30
presence_stale_s = 120

db_path = /var/lib/takbridge/takbridge.db
socket_path = /run/takbridge/takbridge.sock

# Shared secret for X-TakBridge-Signature. At least 16 characters; generate
# with:  python3 -c "import secrets; print(secrets.token_urlsafe(32))"
webhook_secret = CHANGE-ME-TO-A-LONG-RANDOM-STRING
webhook_timeout_s = 10
webhook_retries = 3

# Unix users allowed to reach the control socket (see takbridge/control.py).
bot_login_user = takbot
admin_group = takadmin

[limits]
chat_chars = 2000
name_chars = 40
remarks_chars = 500
outbound_per_minute = 20
stale_after_s = 600
request_bytes = 262144
request_items = 200
snapshots_kept = 5

# One section per bot. The callsign is what appears in ATAK.
[bot:GROK-1]
webhook_url = http://grokbot.example.ts.net:8080/takbridge
# TLS only: this bot's client certificate and key, issued by the TAK Server.
PYTAK_TLS_CLIENT_CERT = /etc/takbridge/certs/grok-1.pem
PYTAK_TLS_CLIENT_KEY = /etc/takbridge/certs/grok-1.key
PYTAK_TLS_CLIENT_CAFILE = /etc/takbridge/certs/truststore-root.pem
